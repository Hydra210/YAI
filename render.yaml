services:
  - type: web
    name: yuki-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # memory: on the free plan the database resets on every deploy.
      # To keep it, switch to a paid plan, uncomment the disk below and this env var.
      # - key: DATABASE_PATH
      #   value: /data/yuki.db
    # disk:
    #   name: yuki-memory
    #   mountPath: /data
    #   sizeGB: 1
