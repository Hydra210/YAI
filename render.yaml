services:
  - type: web
    name: yuki-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: yuki.db
      - key: MEMORY_RETENTION_DAYS
        value: "90"
      - key: LEARN_INTERVAL_SECONDS
        value: "300"
      - key: LEARN_EVERY_MESSAGES
        value: "25"
      - key: VIBE_EVERY_MESSAGES
        value: "90"
      - key: AI_REQUEST_GAP
        value: "1.25"
      - key: DISCORD_REPLY_GAP
        value: "0.75"
      - key: SKILLS_MODE
        value: auto
      - key: OWNER_ID
        sync: false
      - key: ENABLE_RUN_PYTHON
        value: "0"
      - key: REPLY_TIMEOUT_SECONDS
        value: "90"
