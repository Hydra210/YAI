services:
  - type: web
    name: yuki-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        sync: false
      - key: RIVAL_USER_IDS
        value: "1520484620129402992"
      - key: RIVAL_ROAST_CHANCE
        value: "0.15"
      - key: RIVAL_LEARN_EVERY_MESSAGES
        value: "10"
      - key: MEMORY_RETENTION_DAYS
        value: "90"
      - key: LEARN_INTERVAL_SECONDS
        value: "300"
      - key: LEARN_EVERY_MESSAGES
        value: "25"
      - key: VIBE_EVERY_MESSAGES
        value: "90"
      - key: AI_REQUEST_GAP
        value: "1.25"
      - key: DISCORD_REPLY_GAP
        value: "0.75"
      - key: SKILLS_MODE
        value: auto
      - key: OWNER_ID
        sync: false
      - key: ENABLE_RUN_PYTHON
        value: "0"        # set to "1" to let Yuki use python as a fallback tool (see README)
      - key: RUN_PYTHON_OWNER_ONLY
        value: "0"        # "1" = only OWNER_ID can trigger it
      - key: REPLY_TIMEOUT_SECONDS
        value: "90"
      - key: KEYS_PAGE_TOKEN
        sync: false   # optional: set a password, then open /keys?token=<it>
